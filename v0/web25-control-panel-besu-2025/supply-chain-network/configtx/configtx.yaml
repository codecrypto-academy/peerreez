# Configuración de red para Supply Chain Traceability
# 4 Organizaciones: Producer, Factory, Retailer, Consumer

Organizations:
  # Orderer Organization
  - &OrdererOrg
      Name: OrdererOrg
      ID: OrdererMSP
      MSPDir: ../crypto-config/ordererOrganizations/supplychain.com/msp
      Policies:
          Readers:
              Type: Signature
              Rule: "OR('OrdererMSP.member')"
          Writers:
              Type: Signature
              Rule: "OR('OrdererMSP.member')"
          Admins:
              Type: Signature
              Rule: "OR('OrdererMSP.admin')"
      OrdererEndpoints:
          - orderer.supplychain.com:7050

  # Producer Organization (Materia Prima)
  - &ProducerOrg
      Name: ProducerMSP
      ID: ProducerMSP
      MSPDir: ../crypto-config/peerOrganizations/producer.supplychain.com/msp
      Policies:
          Readers:
              Type: Signature
              Rule: "OR('ProducerMSP.admin', 'ProducerMSP.peer', 'ProducerMSP.client')"
          Writers:
              Type: Signature
              Rule: "OR('ProducerMSP.admin', 'ProducerMSP.client')"
          Admins:
              Type: Signature
              Rule: "OR('ProducerMSP.admin')"
          Endorsement:
              Type: Signature
              Rule: "OR('ProducerMSP.peer')"
      AnchorPeers:
          - Host: peer0.producer.supplychain.com
            Port: 7051

  # Factory Organization (Transformación)
  - &FactoryOrg
      Name: FactoryMSP
      ID: FactoryMSP
      MSPDir: ../crypto-config/peerOrganizations/factory.supplychain.com/msp
      Policies:
          Readers:
              Type: Signature
              Rule: "OR('FactoryMSP.admin', 'FactoryMSP.peer', 'FactoryMSP.client')"
          Writers:
              Type: Signature
              Rule: "OR('FactoryMSP.admin', 'FactoryMSP.client')"
          Admins:
              Type: Signature
              Rule: "OR('FactoryMSP.admin')"
          Endorsement:
              Type: Signature
              Rule: "OR('FactoryMSP.peer')"
      AnchorPeers:
          - Host: peer0.factory.supplychain.com
            Port: 8051

  # Retailer Organization (Distribución)
  - &RetailerOrg
      Name: RetailerMSP
      ID: RetailerMSP
      MSPDir: ../crypto-config/peerOrganizations/retailer.supplychain.com/msp
      Policies:
          Readers:
              Type: Signature
              Rule: "OR('RetailerMSP.admin', 'RetailerMSP.peer', 'RetailerMSP.client')"
          Writers:
              Type: Signature
              Rule: "OR('RetailerMSP.admin', 'RetailerMSP.client')"
          Admins:
              Type: Signature
              Rule: "OR('RetailerMSP.admin')"
          Endorsement:
              Type: Signature
              Rule: "OR('RetailerMSP.peer')"
      AnchorPeers:
          - Host: peer0.retailer.supplychain.com
            Port: 9051

  # Consumer Organization (Consumidor Final)
  - &ConsumerOrg
      Name: ConsumerMSP
      ID: ConsumerMSP
      MSPDir: ../crypto-config/peerOrganizations/consumer.supplychain.com/msp
      Policies:
          Readers:
              Type: Signature
              Rule: "OR('ConsumerMSP.admin', 'ConsumerMSP.peer', 'ConsumerMSP.client')"
          Writers:
              Type: Signature
              Rule: "OR('ConsumerMSP.admin', 'ConsumerMSP.client')"
          Admins:
              Type: Signature
              Rule: "OR('ConsumerMSP.admin')"
          Endorsement:
              Type: Signature
              Rule: "OR('ConsumerMSP.peer')"
      AnchorPeers:
          - Host: peer0.consumer.supplychain.com
            Port: 10051

# Capabilities para la versión de Fabric
Capabilities:
    Channel: &ChannelCapabilities
        V2_0: true
    Orderer: &OrdererCapabilities
        V2_0: true
    Application: &ApplicationCapabilities
        V2_5: true

# Configuración de aplicación por defecto
Application: &ApplicationDefaults
    Organizations:
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        # Políticas de endorsement específicas para supply chain
        LifecycleEndorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"
        Endorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"
    Capabilities:
        <<: *ApplicationCapabilities

# Configuración del orderer
Orderer: &OrdererDefaults
    OrdererType: solo
    Addresses:
        - orderer.supplychain.com:7050
    BatchTimeout: 2s
    BatchSize:
        MaxMessageCount: 10
        AbsoluteMaxBytes: 99 MB
        PreferredMaxBytes: 512 KB
    Organizations:
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        BlockValidation:
            Type: ImplicitMeta
            Rule: "ANY Writers"
    Capabilities:
        <<: *OrdererCapabilities

# Configuración de canal por defecto
Channel: &ChannelDefaults
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
    Capabilities:
        <<: *ChannelCapabilities

# Perfiles de configuración
Profiles:
    # Perfil para el genesis block del orderer
    SupplyChainOrdererGenesis:
        <<: *ChannelDefaults
        Orderer:
            <<: *OrdererDefaults
            Organizations:
                - *OrdererOrg
            Capabilities:
                <<: *OrdererCapabilities
        Consortiums:
            SupplyChainConsortium:
                Organizations:
                    - *ProducerOrg
                    - *FactoryOrg
                    - *RetailerOrg
                    - *ConsumerOrg

    # Perfil para el canal de supply chain
    SupplyChainChannel:
        Consortium: SupplyChainConsortium
        <<: *ChannelDefaults
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - *ProducerOrg
                - *FactoryOrg
                - *RetailerOrg
                - *ConsumerOrg
            Capabilities:
                <<: *ApplicationCapabilities