# Configuración para generar material cryptográfico
# Supply Chain Network - 4 Organizaciones

# Organización Orderer
OrdererOrgs:
  - Name: Orderer
    Domain: supplychain.com
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer

# Organizaciones de Peers para Supply Chain
PeerOrgs:
  # Organización Producer (Productores de materia prima)
  - Name: Producer
    Domain: producer.supplychain.com
    EnableNodeOUs: true
    Template:
      Count: 1
      Start: 0
      Hostname: peer{{.Index}}
    Users:
      Count: 2  # Admin y User1

  # Organización Factory (Fábricas)
  - Name: Factory
    Domain: factory.supplychain.com
    EnableNodeOUs: true
    Template:
      Count: 1
      Start: 0
      Hostname: peer{{.Index}}
    Users:
      Count: 2  # Admin y User1

  # Organización Retailer (Minoristas)
  - Name: Retailer
    Domain: retailer.supplychain.com
    EnableNodeOUs: true
    Template:
      Count: 1
      Start: 0
      Hostname: peer{{.Index}}
    Users:
      Count: 2  # Admin y User1

  # Organización Consumer (Consumidores)
  - Name: Consumer
    Domain: consumer.supplychain.com
    EnableNodeOUs: true
    Template:
      Count: 1
      Start: 0
      Hostname: peer{{.Index}}
    Users:
      Count: 2  # Admin y User1